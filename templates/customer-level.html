<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Level | InTallygence</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Common Header CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/header.css') }}"
    >


    <!-- Customer Level CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/customer-level.css') }}"
    >

</head>


<body>

    <!-- =====================================================
         COMMON APPLICATION HEADER
         ===================================================== -->

    


    <!-- =====================================================
         CUSTOMER LEVEL REPORT
         ===================================================== -->

    <main class="customer-report">

        {% include 'header.html' %}

        <!-- Report title + filters -->

        <section class="report-top">

            <div class="report-title">

                <a
                    class="back-link"
                    href="{{ url_for('report_dashboard') }}"
                    aria-label="Back to Reports"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Reports
                </a>


                <div class="header-content">

                    <p class="eyebrow">
                        Sales Reports
                    </p>

                    <h1>
                        Customer Level
                    </h1>

                    <p class="subtitle">
                        Customer-wise sales, contribution and running percentage.
                    </p>

                </div>

            </div>


            <!-- Period Filter -->

            <form
                id="periodForm"
                class="period-form"
            >

                <label for="fromDate">

                    From

                    <input
                        id="fromDate"
                        type="date"
                        required
                    >

                </label>


                <label for="toDate">

                    To

                    <input
                        id="toDate"
                        type="date"
                        required
                    >

                </label>


                <button
                    type="submit"
                    id="applyPeriodBtn"
                >

                    <!-- <i class="fa-solid fa-rotate"></i> -->

                    Apply period

                </button>

            </form>

        </section>


        <!-- =================================================
             REPORT TABLE
             ================================================= -->

        <section
            class="report-table-card"
            aria-live="polite"
        >

            <div
                id="reportStatus"
                class="report-status"
            >
                Loading customer sales…
            </div>


            <div
                id="tableWrap"
                class="table-wrap"
                hidden
            ></div>

        </section>

    </main>


    <!-- Customer Level JavaScript -->
    <script
    src="{{ url_for('static', filename='js/header.js') }}"
    ></script>
    <script
        src="{{ url_for('static', filename='js/customer-level.js') }}"
    ></script>

</body>

</html>
