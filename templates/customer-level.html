<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Level | InTallygence</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/customer-level.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/export-excel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/report-viewport.css') }}">

    <style>
        /* =========================================================
           1. VIEWPORT LOCKDOWN & MAIN LAYOUT
        ========================================================= */
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            background: #f4f7fb;
            font-family: "Inter", Arial, sans-serif;
        }

        .customer-report {
            display: flex !important;
            flex-direction: column !important;
            height: 100vh !important;
            min-height: 0 !important;
            overflow: hidden !important;
            padding: 16px 3.5% !important;
            box-sizing: border-box !important;
        }

        /* =========================================================
           2. REPORT TOP (TITLE LEFT, FILTER CARD RIGHT)
        ========================================================= */
        .customer-report .report-top {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 30px !important;
            width: 100% !important;
            margin: 0 0 16px 0 !important;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            flex: 0 0 auto !important;
        }

        .customer-report .report-title {
            display: flex !important;
            align-items: flex-start !important;
            gap: 18px !important;
            min-width: 0 !important;
            flex: 1 1 auto !important;
        }

        .customer-report .back-link {
            display: inline-flex !important;
            align-items: center !important;
            gap: 7px !important;
            margin-top: 3px !important;
            color: #1558a6 !important;
            text-decoration: none !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            white-space: nowrap !important;
        }

        .customer-report .back-link:hover {
            color: #0d47a1 !important;
        }

        .customer-report .header-content {
            min-width: 0 !important;
        }

        .customer-report .eyebrow {
            margin: 0 0 4px !important;
            color: #64748b !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.08em !important;
        }

        .customer-report .header-content h1 {
            margin: 0 !important;
            color: #102a4c !important;
            font-size: 28px !important;
            line-height: 1.2 !important;
            font-weight: 700 !important;
            white-space: nowrap !important;
        }

        .customer-report .subtitle {
            margin: 7px 0 0 !important;
            color: #58708f !important;
            font-size: 14px !important;
            line-height: 1.4 !important;
            white-space: nowrap !important;
        }

        /* Right Side: Compact Ambient Shadow Filter Box */
        .customer-report .period-form {
            display: inline-flex !important;
            align-items: flex-end !important;
            gap: 12px !important;
            width: auto !important;
            max-width: fit-content !important;
            flex-shrink: 0 !important;
            margin: 0 !important;
            padding: 14px 18px !important;
            background: #ffffff !important;
            border: 1px solid #dce5f0 !important;
            border-radius: 12px !important;
            box-shadow: 0 6px 22px rgba(24, 48, 86, 0.08), 
                        0 2px 6px rgba(24, 48, 86, 0.04) !important;
        }

        .customer-report .format-control {
            position: relative !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 5px !important;
            width: 105px !important;
            min-width: 105px !important;
        }

        .customer-report .customer-filter-control {
            position: relative !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 5px !important;
            width: 200px !important;
            min-width: 200px !important;
        }

        .customer-report .filter-caption {
            color: #475569 !important;
            font-size: 11px !important;
            font-weight: 700 !important;
            white-space: nowrap !important;
        }

        .customer-report .format-button {
            width: 105px !important;
            height: 38px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 0 10px !important;
            color: #17223b !important;
            background: #ffffff !important;
            border: 1px solid #bccadd !important;
            border-radius: 6px !important;
            font: 500 12px Inter, Arial, sans-serif !important;
            cursor: pointer !important;
            outline: none !important;
        }

        .customer-report .customer-filter-select {
            width: 200px !important;
            height: 38px !important;
            padding: 0 26px 0 10px !important;
            color: #17223b !important;
            background: #ffffff !important;
            border: 1px solid #bccadd !important;
            border-radius: 6px !important;
            font: 500 12px Inter, Arial, sans-serif !important;
            cursor: pointer !important;
            outline: none !important;
        }

        /* Solid Blue Apply Button */
        .custom-apply-btn,
        .custom-apply-button,
        #applyCustomPeriodBtn {
            width: 100% !important;
            height: 36px !important;
            margin-top: 6px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background-color: #1d5b9f !important;
            border: 1px solid #1d5b9f !important;
            color: #ffffff !important;
            border-radius: 6px !important;
            font: 600 12px Inter, Arial, sans-serif !important;
            cursor: pointer !important;
            transition: background-color 0.2s ease, border-color 0.2s ease !important;
        }

        .custom-apply-btn:hover,
        .custom-apply-button:hover,
        #applyCustomPeriodBtn:hover {
            background-color: #15487f !important;
            border-color: #15487f !important;
        }

        /* =========================================================
           3. EXPORT MENU (3-DOTS BUTTON & BOLD GREEN TEXT)
        ========================================================= */
        .export-excel-row {
            display: flex !important;
            justify-content: flex-end !important;
            align-items: center !important;
            width: 100% !important;
            margin-bottom: 8px !important;
            position: relative !important;
            z-index: 1000 !important;
            flex: 0 0 auto !important;
            pointer-events: auto !important;
        }

        .export-menu {
            position: relative !important;
            display: inline-block !important;
        }

        .export-menu-toggle {
            background: #ffffff !important;
            border: 1px solid #b8cadb !important;
            border-radius: 6px !important;
            padding: 8px 12px !important;
            cursor: pointer !important;
            color: #17223b !important;
            font-size: 14px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .export-menu-toggle:hover {
            background: #f1f5f9 !important;
        }

        .export-menu-panel {
            position: absolute !important;
            right: 0 !important;
            top: calc(100% + 4px) !important;
            background: #ffffff !important;
            border: 1px solid #b8cadb !important;
            border-radius: 6px !important;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15) !important;
            min-width: 160px !important;
            padding: 4px !important;
            z-index: 1001 !important;
        }

        .export-menu-panel[hidden] {
            display: none !important;
        }

        #exportExcelBtn,
        .export-menu-panel button.export-excel-btn {
            width: 100% !important;
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            padding: 8px 12px !important;
            background: transparent !important;
            border: none !important;
            border-radius: 4px !important;
            color: #1a7340 !important;
            font-size: 12px !important;
            cursor: pointer !important;
            text-align: left !important;
            text-decoration: none !important;
            pointer-events: auto !important;
        }

        #exportExcelBtn i,
        .export-menu-panel button.export-excel-btn i {
            color: #1a7340 !important;
            font-size: 12px !important;
        }

        #exportExcelBtn:hover,
        .export-menu-panel button.export-excel-btn:hover {
            background: #eef7f2 !important;
            color: #1a7340 !important;
        }

        /* =========================================================
           4. TABLE CONTAINER & STRICT STICKY TABLE
        ========================================================= */
        .customer-report > .report-table-card {
            flex: 1 1 0 !important;
            min-height: 0 !important;
            height: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
            background: #ffffff !important;
            border: 1px solid #dce5f0 !important;
            border-radius: 12px !important;
            box-shadow: 0 5px 18px rgb(24 48 86 / 7%) !important;
        }

        .customer-report .table-wrap {
            flex: 1 1 0 !important;
            width: 100% !important;
            height: 100% !important;
            min-height: 0 !important;
            overflow: auto !important;
            position: relative !important;
        }

        .customer-table,
        .comparison-table,
        .ytd-table {
            width: 100% !important;
            min-width: 1100px !important;
            border-collapse: separate !important;
            border-spacing: 0 !important;
            font-size: 12px !important;
        }

        .customer-table thead,
        .comparison-table thead,
        .customer-table tfoot,
        .comparison-table tfoot {
            position: static !important;
        }

        /* Row 1 Headers (Top: 0) */
        .customer-table thead tr:first-child th,
        .comparison-table thead tr:first-child th {
            position: sticky !important;
            top: 0 !important;
            z-index: 20 !important;
            height: 38px !important;
            min-height: 38px !important;
            max-height: 38px !important;
            line-height: 20px !important;
            background: #c4c4c4 !important;
            color: #132a46 !important;
            border-right: 1px solid #b0b0b0 !important;
            border-bottom: 1px solid #b0b0b0 !important;
            font-weight: 700 !important;
            white-space: nowrap !important;
            box-sizing: border-box !important;
            text-align: center !important;
            padding: 8px !important;
        }

        /* Row 2 Headers (Top: 38px) */
        .customer-table thead tr:nth-child(2) th,
        .comparison-table thead tr:nth-child(2) th {
            position: sticky !important;
            top: 38px !important;
            z-index: 20 !important;
            height: 38px !important;
            min-height: 38px !important;
            max-height: 38px !important;
            line-height: 20px !important;
            background: #c4c4c4 !important;
            color: #132a46 !important;
            border-right: 1px solid #b0b0b0 !important;
            border-bottom: 1px solid #b0b0b0 !important;
            font-weight: 700 !important;
            white-space: nowrap !important;
            box-sizing: border-box !important;
            text-align: right !important;
            padding: 8px !important;
        }

        .customer-table thead th.comparison-growth-header {
            position: sticky !important;
            top: 0 !important;
            z-index: 20 !important;
            height: 76px !important;
            min-height: 76px !important;
            max-height: 76px !important;
            line-height: 20px !important;
            vertical-align: middle !important;
            box-sizing: border-box !important;
        }

        /* TOP-LEFT FROZEN CORNER: Customer Header (Exact 76px, Freeze Top:0 & Left:0) */
        .customer-table thead tr:first-child th:first-child,
        .customer-table thead th.frozen-customer-header,
        .customer-table thead th.comparison-customer-header {
            position: sticky !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 99 !important; /* Highest layer: Nothing overlaps on horizontal scroll */
            width: 260px !important;
            min-width: 260px !important;
            max-width: 260px !important;
            height: 76px !important;
            min-height: 76px !important;
            max-height: 76px !important;
            background: #c4c4c4 !important;
            border-top: none !important;
            border-left: 1px solid #b0b0b0 !important;
            border-right: 2px solid #94a3b8 !important;
            border-bottom: 1px solid #b0b0b0 !important;
            box-sizing: border-box !important;
            text-align: left !important;
            vertical-align: middle !important;
            padding: 0 12px !important;
        }

        /* First Column in Body (Customer Names) - Freeze Left */
        .customer-table tbody td:first-child,
        .comparison-table tbody td:first-child {
            position: sticky !important;
            left: 0 !important;
            z-index: 30 !important;
            width: 260px !important;
            min-width: 260px !important;
            max-width: 260px !important;
            background: #ffffff !important;
            color: #17223b !important;
            font-weight: 600 !important;
            text-align: left !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
            border-left: 1px solid #e6edf4 !important;
            border-right: 2px solid #b8c4d1 !important;
            padding: 9px 12px !important;
            box-sizing: border-box !important;
        }

        .customer-table tbody tr:hover td:first-child,
        .comparison-table tbody tr:hover td:first-child {
            background: #f0f8fc !important;
        }

        /* Normal Data Cells */
        .customer-table td,
        .comparison-table td {
            border-right: 1px solid #e6edf4 !important;
            border-bottom: 1px solid #e6edf4 !important;
            padding: 9px 8px !important;
            text-align: right !important;
            white-space: nowrap !important;
            box-sizing: border-box !important;
        }

        /* Grand Total Footer (Freeze Bottom) */
        .customer-table tfoot td,
        .comparison-table tfoot td {
            position: sticky !important;
            bottom: 0 !important;
            z-index: 35 !important;
            background: #ddecf4 !important;
            color: #132a46 !important;
            border-top: 2px solid #9ec5d8 !important;
            border-right: 1px solid #9ec5d8 !important;
            font-weight: 700 !important;
            text-align: right !important;
            white-space: nowrap !important;
            padding: 10px 8px !important;
            box-sizing: border-box !important;
        }

        /* Bottom-Left Grand Total Label (Freeze Bottom & Left) */
        .customer-table tfoot td:first-child,
        .comparison-table tfoot td:first-child {
            position: sticky !important;
            left: 0 !important;
            bottom: 0 !important;
            z-index: 85 !important;
            width: 260px !important;
            min-width: 260px !important;
            max-width: 260px !important;
            background: #ddecf4 !important;
            color: #132a46 !important;
            font-weight: 700 !important;
            border-left: 1px solid #9ec5d8 !important;
            border-right: 2px solid #9ec5d8 !important;
            border-top: 2px solid #9ec5d8 !important;
            text-align: left !important;
            padding-left: 12px !important;
            box-sizing: border-box !important;
        }
    </style>
</head>

<body>

    <main class="customer-report">

        {% include 'header.html' %}

        <!-- Top Title + Filters -->
        <section class="report-top">
            <div class="report-title">
                <a class="back-link" href="{{ url_for('report_dashboard', modal='sales') }}" aria-label="Back to Reports">
                    <i class="fa-solid fa-arrow-left"></i>
                    Reports
                </a>

                <div class="header-content">
                    <p class="eyebrow">Sales Reports</p>
                    <h1>Customer Level</h1>
                    <p class="subtitle">Customer-wise sales analysis, contribution and growth comparison.</p>
                </div>
            </div>

            <!-- Single Ambient Glow Filter Card -->
            <form id="periodForm" class="period-form">
                <!-- 1. FORMAT -->
                <div class="format-control">
                    <span class="filter-caption">Format</span>
                    <button type="button" id="formatValue" class="format-button" aria-expanded="false">
                        YTD <i class="fa-solid fa-chevron-down"></i>
                    </button>

                    <div id="formatMenu" class="format-menu" hidden>
                        <!-- YTD -->
                        <div class="format-menu-group">
                            <button type="button" class="format-option format-parent" data-parent="YTD">
                                YTD <i class="fa-solid fa-chevron-right"></i>
                            </button>
                            <div class="format-submenu" data-submenu="YTD">
                                <label class="period-year-control">
                                    Year
                                    <select class="period-year-select ytd-year-select" aria-label="YTD fiscal year"></select>
                                </label>
                            </div>
                        </div>

                        <!-- QTD -->
                        <div class="format-menu-group">
                            <button type="button" class="format-option format-parent" data-parent="QTD">
                                QTD <i class="fa-solid fa-chevron-right"></i>
                            </button>
                            <div class="format-submenu" data-submenu="QTD">
                                <label class="period-year-control">
                                    Year
                                    <select class="period-year-select qtd-year-select" aria-label="QTD fiscal year"></select>
                                </label>
                                <button type="button" data-quarter="Q1">Q1 <span>Apr - Jun</span></button>
                                <button type="button" data-quarter="Q2">Q2 <span>Jul - Sep</span></button>
                                <button type="button" data-quarter="Q3">Q3 <span>Oct - Dec</span></button>
                                <button type="button" data-quarter="Q4">Q4 <span>Jan - Mar</span></button>
                            </div>
                        </div>

                        <!-- MTD -->
                        <div class="format-menu-group">
                            <button type="button" class="format-option format-parent" data-parent="MTD">
                                MTD <i class="fa-solid fa-chevron-right"></i>
                            </button>
                            <div class="format-submenu" data-submenu="MTD">
                                <label class="period-year-control">
                                    Year
                                    <select class="period-year-select mtd-year-select" aria-label="MTD fiscal year"></select>
                                </label>
                                <button type="button" data-month="April">April</button>
                                <button type="button" data-month="May">May</button>
                                <button type="button" data-month="June">June</button>
                                <button type="button" data-month="July">July</button>
                                <button type="button" data-month="August">August</button>
                                <button type="button" data-month="September">September</button>
                                <button type="button" data-month="October">October</button>
                                <button type="button" data-month="November">November</button>
                                <button type="button" data-month="December">December</button>
                                <button type="button" data-month="January">January</button>
                                <button type="button" data-month="February">February</button>
                                <button type="button" data-month="March">March</button>
                            </div>
                        </div>

                        <!-- CUSTOM -->
                        <div class="format-menu-group">
                            <button type="button" class="format-option format-parent" data-parent="CUSTOM">
                                Custom <i class="fa-solid fa-chevron-right"></i>
                            </button>
                            <div class="format-submenu custom-submenu" data-submenu="CUSTOM">
                                <label class="custom-date-control" for="fromDate">
                                    From
                                    <input id="fromDate" type="date" required>
                                </label>
                                <label class="custom-date-control" for="toDate">
                                    To
                                    <input id="toDate" type="date" required>
                                </label>
                                <button type="button" id="applyCustomPeriodBtn" class="custom-apply-btn">Apply</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. CUSTOMER FILTER -->
                <div class="customer-filter-control">
                    <span class="filter-caption">Customer</span>
                    <select id="customerFilter" class="customer-filter-select" aria-label="Filter customer">
                        <option value="">All Customers</option>
                    </select>
                </div>

                <!-- Hidden inputs for script processing -->
                <input id="fromDate" type="date" style="display:none;">
                <input id="toDate" type="date" style="display:none;">
            </form>
        </section>

        <!-- Export Button Row -->
        <div class="export-excel-row">
            <div class="export-menu" data-export-menu>
                <button type="button" class="export-menu-toggle" aria-label="More report actions" aria-expanded="false">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>
                <div class="export-menu-panel" hidden>
                    <button type="button" id="exportExcelBtn" class="export-excel-btn" title="Export report to Excel">
                        <i class="fa-solid fa-file-excel"></i>
                        Export Excel
                    </button>
                </div>
            </div>
        </div>

        <!-- Report Table Container -->
        <section class="report-table-card" aria-live="polite">
            <div id="reportStatus" class="report-status">
                Loading customer sales…
            </div>
            <div id="tableWrap" class="table-wrap" hidden></div>
        </section>

    </main>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/header.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="{{ url_for('static', filename='js/customer-level.js') }}"></script>

    <!-- Export Menu Toggle Script -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const exportMenu = document.querySelector("[data-export-menu]");
        if (!exportMenu) return;

        const toggleBtn = exportMenu.querySelector(".export-menu-toggle");
        const panel = exportMenu.querySelector(".export-menu-panel");

        toggleBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            const isHidden = panel.hasAttribute("hidden");
            if (isHidden) {
                panel.removeAttribute("hidden");
                toggleBtn.setAttribute("aria-expanded", "true");
            } else {
                panel.setAttribute("hidden", "");
                toggleBtn.setAttribute("aria-expanded", "false");
            }
        });

        document.addEventListener("click", function (e) {
            if (!exportMenu.contains(e.target)) {
                panel.setAttribute("hidden", "");
                toggleBtn.setAttribute("aria-expanded", "false");
            }
        });
    });
    </script>
</body>

</html>
