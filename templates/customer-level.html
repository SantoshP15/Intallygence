<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Level | InTallygence</title>


    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Common Header CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/header.css') }}"
    >


    <!-- Customer Level CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/customer-level.css') }}"
    >

</head>


<body>

    <main class="customer-report">

        {% include 'header.html' %}


        <!-- =====================================================
             REPORT TOP
             ===================================================== -->

        <section class="report-top">

            <div class="report-title">

                <a
                    class="back-link"
                    href="{{ url_for('report_dashboard') }}"
                    aria-label="Back to Reports"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Reports
                </a>


                <div class="header-content">

                    <p class="eyebrow">
                        Sales Reports
                    </p>

                    <h1>
                        Customer Level
                    </h1>

                    <p class="subtitle">
                        Customer-wise sales comparison and growth.
                    </p>

                </div>

            </div>


            <!-- =================================================
                 PERIOD FILTER
                 ================================================= -->

            <form
                id="periodForm"
                class="period-form"
            >

                <!-- FORMAT -->

                <div class="format-control">

                    <span class="filter-caption">
                        Format
                    </span>

                    <button
                        type="button"
                        id="formatValue"
                        class="format-button"
                    >
                        YTD
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>


                    <div
                        id="formatMenu"
                        class="format-menu"
                        hidden
                    >

                        <!-- YTD -->

                        <button
                            type="button"
                            class="format-option"
                            data-format="YTD"
                        >
                            YTD
                        </button>


                        <!-- MTD -->

                        <div class="format-menu-group">

                            <button
                                type="button"
                                class="format-option format-parent"
                                data-parent="MTD"
                            >
                                MTD
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>


                            <div
                                class="format-submenu"
                                data-submenu="MTD"
                            >

                                <button type="button" data-format="MTD" data-month="April">
                                    April
                                </button>

                                <button type="button" data-format="MTD" data-month="May">
                                    May
                                </button>

                                <button type="button" data-format="MTD" data-month="June">
                                    June
                                </button>

                                <button type="button" data-format="MTD" data-month="July">
                                    July
                                </button>

                                <button type="button" data-format="MTD" data-month="August">
                                    August
                                </button>

                                <button type="button" data-format="MTD" data-month="September">
                                    September
                                </button>

                                <button type="button" data-format="MTD" data-month="October">
                                    October
                                </button>

                                <button type="button" data-format="MTD" data-month="November">
                                    November
                                </button>

                                <button type="button" data-format="MTD" data-month="December">
                                    December
                                </button>

                                <button type="button" data-format="MTD" data-month="January">
                                    January
                                </button>

                                <button type="button" data-format="MTD" data-month="February">
                                    February
                                </button>

                                <button type="button" data-format="MTD" data-month="March">
                                    March
                                </button>

                            </div>

                        </div>


                        <!-- QTD -->

                        <div class="format-menu-group">

                            <button
                                type="button"
                                class="format-option format-parent"
                                data-parent="QTD"
                            >
                                QTD
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>


                            <div
                                class="format-submenu"
                                data-submenu="QTD"
                            >

                                <button
                                    type="button"
                                    data-format="QTD"
                                    data-quarter="Q1"
                                >
                                    Q1
                                    <span>Apr - Jun</span>
                                </button>

                                <button
                                    type="button"
                                    data-format="QTD"
                                    data-quarter="Q2"
                                >
                                    Q2
                                    <span>Jul - Sep</span>
                                </button>

                                <button
                                    type="button"
                                    data-format="QTD"
                                    data-quarter="Q3"
                                >
                                    Q3
                                    <span>Oct - Dec</span>
                                </button>

                                <button
                                    type="button"
                                    data-format="QTD"
                                    data-quarter="Q4"
                                >
                                    Q4
                                    <span>Jan - Mar</span>
                                </button>

                            </div>

                        </div>


                        <!-- CUSTOM -->

                        <button
                            type="button"
                            class="format-option"
                            data-format="CUSTOM"
                        >
                            Custom
                        </button>

                    </div>

                </div>


                <!-- FROM -->

                <label for="fromDate">

                    From

                    <input
                        id="fromDate"
                        type="date"
                        required
                    >

                </label>


                <!-- TO -->

                <label for="toDate">

                    To

                    <input
                        id="toDate"
                        type="date"
                        required
                    >

                </label>


                <!-- APPLY -->

                <button
                    type="submit"
                    id="applyPeriodBtn"
                >
                    Apply period
                </button>

            </form>

        </section>


        <!-- =====================================================
             REPORT TABLE
             ===================================================== -->

        <section
            class="report-table-card"
            aria-live="polite"
        >

            <div
                id="reportStatus"
                class="report-status"
            >
                Loading customer sales…
            </div>


            <div
                id="tableWrap"
                class="table-wrap"
                hidden
            ></div>

        </section>

    </main>


    <!-- Common Header JavaScript -->

    <script
        src="{{ url_for('static', filename='js/header.js') }}"
    ></script>


    <!-- Customer Level JavaScript -->

    <script
        src="{{ url_for('static', filename='js/customer-level.js') }}"
    ></script>

</body>

</html>
