<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Itemwise-Customer | InTallygence</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Shared header CSS MUST load before report CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/header.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/itemwise-customer.css') }}"
    >
</head>

<body>

    <main class="itemwise-customer-report">

        {% include 'header.html' %}

        <!-- =====================================================
             REPORT HEADER + FILTERS
             ===================================================== -->

        <section class="report-top">

            <div class="report-title">

                <a
                    class="back-link"
                    href="{{ url_for('report_dashboard') }}"
                    aria-label="Back to Reports"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Reports
                </a>

                <div class="header-content">

                    <p class="eyebrow">
                        Sales Reports
                    </p>

                    <h1>
                        Itemwise-Customer
                    </h1>

                    <p class="subtitle">
                        Item-wise customer sales, contribution and running percentage.
                    </p>

                </div>

            </div>


            <!-- =================================================
                 REPORT FILTERS
                 ================================================= -->

            <form
                id="periodForm"
                class="period-form"
            >

                <!-- ITEM -->

                <label for="itemSelect">

                    Item

                    <select
                        id="itemSelect"
                        name="item"
                    >
                        <option value="">
                            All Items
                        </option>
                    </select>

                </label>


                <!-- FROM DATE -->

                <label for="fromDate">

                    From

                    <input
                        id="fromDate"
                        name="from"
                        type="date"
                        required
                    >

                </label>


                <!-- TO DATE -->

                <label for="toDate">

                    To

                    <input
                        id="toDate"
                        name="to"
                        type="date"
                        required
                    >

                </label>


                <!-- APPLY -->

                <button
                    type="submit"
                    id="applyPeriodBtn"
                >
                    <i class="fa-solid fa-rotate"></i>
                    Apply period
                </button>

            </form>

        </section>


        <!-- =====================================================
             REPORT TABLE
             ===================================================== -->

        <section
            class="report-table-card"
            aria-live="polite"
        >

            <div
                id="reportStatus"
                class="report-status"
            >
                Loading itemwise-customer sales…
            </div>

            <div
                id="tableWrap"
                class="table-wrap"
                hidden
            ></div>

        </section>

    </main>


    <script
    src="{{ url_for('static', filename='js/header.js') }}"
    ></script>

    <script
    src="{{ url_for('static', filename='js/itemwise-customer.js') }}"
    ></script>

</body>
</html>
