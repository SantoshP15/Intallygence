<!doctype html>

<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>InTallygence</title>


    <!-- =====================================================
         SPLASH CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/splash.css') }}"
    >


    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =====================================================
         GOOGLE FONT
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>


    <!-- =====================================================
         SPLASH WRAPPER

         This controls the visible scaled size of the
         1920 × 1080 canvas.
         ===================================================== -->

    <main class="splash-wrapper">


        <!-- =================================================
             1920 × 1080 DESIGN CANVAS
             ================================================= -->

        <section class="hero">


            <!-- =============================================
                 BACKGROUND IMAGE
                 ============================================= -->

            <img
                src="{{ url_for(
                    'static',
                    filename='images/intallygence home-screen.jpg'
                ) }}"
                class="splash-image"
                alt=""
            >


        <!-- =============================================
     MAIN HERO CONTENT
     ============================================= -->

<div class="hero-content">

    <!-- =============================================
         TOPLINE
         ============================================= -->

    <p class="topline">

        Transforming Tally Data Into Business Intelligence

    </p>


    <!-- =============================================
         LOGO
         ============================================= -->

    <div class="logo">

        <img
            src="{{ url_for(
                'static',
                filename='images/logo.svg'
            ) }}"
            alt="InTallygence"
        >

    </div>


    <!-- =============================================
         FEATURES
         ============================================= -->

    <div class="features">

        <span>

            <i class="fa-solid fa-check"></i>

            Real-Time Analytics

        </span>

        <span>

            <i class="fa-solid fa-check"></i>

            Interactive Reports

        </span>

        <span>

            <i class="fa-solid fa-check"></i>

            Smart Insights

        </span>

    </div>
    
    

</div>

            <!-- =============================================
                 ENTER ARROW
                 ============================================= -->

            <!-- =============================================
     MAIN HERO CTA BUTTON
============================================= -->
<div class="hero-action">
 
    <button type="button" id="enterBtn" class="cta-signin-btn enter-arrow">
        <span>Sign In to Dashboard</span>
        <div class="btn-icon">
            <i class="fa-solid fa-arrow-right"></i>
        </div>
    </button>
</div>


        </section>


    </main>


    <!-- =====================================================
         LOGIN CONTAINER
         ===================================================== -->

<!-- =====================================================
     LOGIN CONTAINER (Redesigned)
     ===================================================== -->
<!-- =====================================================
     LOGIN CONTAINER (Redesigned)
     ===================================================== -->
<div class="login-container" id="loginContainer">
    <div class="login-card">
        
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Enter your credentials to access your dashboard</p>

        <form class="login-form" action="{{ url_for('login') }}" method="POST">
            
            <!-- Username -->
            <div class="input-group">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <!-- Password -->
            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <!-- Login Button -->
            <button type="submit" class="login-submit-btn">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <!-- Links moved INSIDE the card -->
        <div class="card-links">
            <a href="#">Forgot password?</a>
            <span class="divider">•</span>
            <a href="#">Sign Up</a>
        </div>

    </div>
</div>    <!-- =====================================================
         LOGIN LINKS
         ===================================================== -->

    <div class="login-links">

        <a href="#">
            Forgot password
        </a>

        <span>|</span>

        <a href="#">
            Sign Up
        </a>

    </div>


    <!-- =====================================================
         LOGIN LOADER
         ===================================================== -->

    <div
        id="loginLoader"
        class="login-loader"
    >

        <div class="loader-content">


            <img
                src="{{ url_for(
                    'static',
                    filename='images/logo.svg'
                ) }}"
                alt="InTallygence"
                class="loader-logo"
            >


            <div class="loader-line">

                <div class="loader-progress"></div>

            </div>


            <p>
                Loading your dashboard...
            </p>


        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="{{ url_for(
            'static',
            filename='js/splash.js'
        ) }}"
    ></script>


</body>

</html>
