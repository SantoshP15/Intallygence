<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank Summary | InTallygence</title>

    <!-- Common Header CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/header.css') }}">

    <!-- Bank Summary CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/bank-summary.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<main id="rahtut" class="bank-summary-report">

    <!-- =========================================================
         COMMON HEADER
    ========================================================== -->

    {% include 'header.html' %}


    <!-- =========================================================
         REPORT HEADER
    ========================================================== -->

    <section class="report-top">

        <div class="report-title">

            <a class="back-link"
               href="{{ url_for('report_dashboard') }}"
               aria-label="Back to Reports">

                <i class="fa-solid fa-arrow-left"></i>
                Reports

            </a>

            <div class="header-content">

                <p class="eyebrow">
                    Cash &amp; Bank Reports
                </p>

                <h1>
                    Bank Summary
                </h1>

                <p class="subtitle">
                    Ledger-wise bank transactions grouped by month and voucher type.
                </p>

            </div>

        </div>


        <!-- =====================================================
             FILTERS
        ====================================================== -->

        <form id="periodForm"
              class="period-form">

            <!-- Party Group -->

            <label for="partyGroupSelect">

                Party Group

                <select id="partyGroupSelect"
                        name="party_group">

                    <option value="">
                        All Party Groups
                    </option>

                </select>

            </label>


            <!-- Group -->

            <label for="groupSelect">

                Group

                <select id="groupSelect"
                        name="group">

                    <option value="">
                        All Groups
                    </option>

                </select>

            </label>


            <!-- From Date -->

            <label for="fromDate">

                From

                <input
                    id="fromDate"
                    name="from"
                    type="date"
                    required
                >

            </label>


            <!-- To Date -->

            <label for="toDate">

                To

                <input
                    id="toDate"
                    name="to"
                    type="date"
                    required
                >

            </label>


            <!-- Apply -->

            <button type="submit"
                    id="applyPeriodBtn">

                <i class="fa-solid fa-rotate"></i>

                Apply

            </button>

        </form>

    </section>


    <!-- =========================================================
         REPORT TABLE
    ========================================================== -->

    <section class="report-table-card"
             aria-live="polite">


        <!-- Status -->

        <div id="reportStatus"
             class="report-status">

            Loading bank summary…

        </div>


        <!-- =====================================================
             SUMMARY CONTROLS
        ====================================================== -->

        <div id="summaryToolbar"
             class="summary-toolbar"
             hidden>

            <div class="summary-toolbar-left">

                <button type="button"
                        id="expandAllBtn"
                        class="summary-action">

                    <i class="fa-solid fa-plus"></i>
                    Expand All

                </button>

                <button type="button"
                        id="collapseAllBtn"
                        class="summary-action">

                    <i class="fa-solid fa-minus"></i>
                    Collapse All

                </button>

            </div>


            <div class="summary-toolbar-right">

                <span id="periodLabel"
                      class="period-label">
                </span>

            </div>

        </div>


        <!-- =====================================================
             TABLE WRAPPER
        ====================================================== -->

        <div id="tableWrap"
             class="table-wrap"
             hidden>
        </div>


    </section>

</main>


<!-- =============================================================
     BANK SUMMARY JAVASCRIPT
============================================================= -->

<script src="{{ url_for('static', filename='js/bank-summary.js') }}"></script>

</body>
</html>
