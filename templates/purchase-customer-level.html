<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customer Level | InTallygence</title>


    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Common Header CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/header.css') }}"
    >


    <!-- Purchase Customer Level CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/purchase-customer-level.css') }}"
    >

    <link rel="stylesheet" href="{{ url_for('static', filename='css/export-excel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/report-viewport.css') }}">
</head>


<body>

    <main class="customer-report">

        {% include 'header.html' %}


        <!-- =====================================================
             REPORT TOP
             ===================================================== -->

        <section class="report-top">
<div class="report-back">
                <a
                    class="back-link"
                    href="{{ url_for('report_dashboard') }}"
                    aria-label="Back to Reports"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Reports
                </a>
            </div>

            <div class="report-filter-area">

<form
                id="periodForm"
                class="period-form"
            >

                <!-- FORMAT -->

                <div class="format-control">

                    <span class="filter-caption">
                        Format
                    </span>

                    <button
                        type="button"
                        id="formatValue"
                        class="format-button"
                    >
                        YTD
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>


                    <div
                        id="formatMenu"
                        class="format-menu"
                        hidden
                    >

                        <!-- YTD -->

                        <div class="format-menu-group">
                            <button
                                type="button"
                                class="format-option format-parent"
                                data-parent="YTD"
                            >
                                YTD
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>

                            <div
                                class="format-submenu"
                                data-submenu="YTD"
                            >
                                <label class="period-year-control">
                                    Year
                                    <select class="period-year-select ytd-year-select" aria-label="YTD fiscal year"></select>
                                </label>
                            </div>
                        </div>
<!-- MTD -->

                        <div class="format-menu-group">

                            <button
                                type="button"
                                class="format-option format-parent"
                                data-parent="MTD"
                            >
                                MTD
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>


                            <div
                                class="format-submenu"
                                data-submenu="MTD"
                            >

                                <label class="period-year-control">
                                    Year
                                    <select class="period-year-select" aria-label="MTD fiscal year"></select>
                                </label>

                                <button type="button" data-format="MTD" data-month="April">
                                    April
                                </button>

                                <button type="button" data-format="MTD" data-month="May">
                                    May
                                </button>

                                <button type="button" data-format="MTD" data-month="June">
                                    June
                                </button>

                                <button type="button" data-format="MTD" data-month="July">
                                    July
                                </button>

                                <button type="button" data-format="MTD" data-month="August">
                                    August
                                </button>

                                <button type="button" data-format="MTD" data-month="September">
                                    September
                                </button>

                                <button type="button" data-format="MTD" data-month="October">
                                    October
                                </button>

                                <button type="button" data-format="MTD" data-month="November">
                                    November
                                </button>

                                <button type="button" data-format="MTD" data-month="December">
                                    December
                                </button>

                                <button type="button" data-format="MTD" data-month="January">
                                    January
                                </button>

                                <button type="button" data-format="MTD" data-month="February">
                                    February
                                </button>

                                <button type="button" data-format="MTD" data-month="March">
                                    March
                                </button>

                            </div>

                        </div>


                        <!-- QTD -->

                        <div class="format-menu-group">

                            <button
                                type="button"
                                class="format-option format-parent"
                                data-parent="QTD"
                            >
                                QTD
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>


                            <div
                                class="format-submenu"
                                data-submenu="QTD"
                            >

                                <label class="period-year-control">
                                    Year
                                    <select class="period-year-select" aria-label="QTD fiscal year"></select>
                                </label>

                                <button
                                    type="button"
                                    data-format="QTD"
                                    data-quarter="Q1"
                                >
                                    Q1
                                    <span>Apr - Jun</span>
                                </button>

                                <button
                                    type="button"
                                    data-format="QTD"
                                    data-quarter="Q2"
                                >
                                    Q2
                                    <span>Jul - Sep</span>
                                </button>

                                <button
                                    type="button"
                                    data-format="QTD"
                                    data-quarter="Q3"
                                >
                                    Q3
                                    <span>Oct - Dec</span>
                                </button>

                                <button
                                    type="button"
                                    data-format="QTD"
                                    data-quarter="Q4"
                                >
                                    Q4
                                    <span>Jan - Mar</span>
                                </button>

                            </div>

                        </div>


                        <!-- CUSTOM -->

                        <div class="format-menu-group">

                            <button
                                type="button"
                                class="format-option format-parent"
                                data-parent="CUSTOM"
                            >
                                Custom
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>


                            <div
                                class="format-submenu custom-submenu"
                                data-submenu="CUSTOM"
                            >

                                <label
                                    class="custom-date-control"
                                    for="fromDate"
                                >
                                    From

                                    <input
                                        id="fromDate"
                                        type="date"
                                        required
                                    >
                                </label>


                                <label
                                    class="custom-date-control"
                                    for="toDate"
                                >
                                    To

                                    <input
                                        id="toDate"
                                        type="date"
                                        required
                                    >
                                </label>


                                <button
                                    type="button"
                                    id="applyCustomPeriodBtn"
                                    class="custom-apply-btn"
                                >
                                    Apply
                                </button>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- FROM -->

                <label for="fromDate">

                    From

                    <input
                        id="fromDate"
                        type="date"
                        required
                    >

                </label>


                <!-- TO -->

                <label for="toDate">

                    To

                    <input
                        id="toDate"
                        type="date"
                        required
                    >

                </label>


                <!-- APPLY -->

            </form>


                <div class="customer-filter-control">

                    <span class="filter-caption">
                        Customer
                    </span>

                    <select
                        id="customerFilter"
                        class="customer-filter-select"
                        aria-label="Filter customer"
                    >
                        <option value="">All Customers</option>
                    </select>

                </div>


            </div>


<section
                class="sales-kpi-card"
                aria-label="Current year monthly sales trend"
            >

                <div class="sales-kpi-header">

                    <div>
                        <span class="sales-kpi-label">
                            Sales Trend
                        </span>

                        <div
                            id="salesKpiValue"
                            class="sales-kpi-value"
                        >
                            —
                        </div>
                    </div>

                    <div
                        id="salesKpiGrowth"
                        class="sales-kpi-growth"
                    >
                        —
                    </div>

                </div>


                <div class="sales-kpi-chart">

                    <canvas
                        id="salesTrendChart"
                    ></canvas>

                </div>

            </section>

        </section>
</section>

                <div class="export-excel-row">
                    <div class="export-menu" data-export-menu>
                        <button type="button" class="export-menu-toggle" aria-label="More report actions" aria-expanded="false"><i class="fa-solid fa-ellipsis"></i></button>
                        <div class="export-menu-panel" hidden><button type="button" class="export-excel-btn" data-export-excel data-sheet="Purchase Customer Level" data-filename="purchase-customer-level"><i class="fa-solid fa-file-excel"></i> Export Excel</button></div>
                    </div>
                </div>
<!-- =====================================================
             REPORT TABLE
             ===================================================== -->

        <section
            class="report-table-card"
            aria-live="polite"
        >

            <div
                id="reportStatus"
                class="report-status"
            >
                Loading customer sales…
            </div>


            <div
                id="tableWrap"
                class="table-wrap"
                hidden
            ></div>

        </section>

    </main>


    <!-- Common Header JavaScript -->

    <script
        src="{{ url_for('static', filename='js/header.js') }}"
    ></script>


    <!-- Chart.js -->

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js"
    ></script>


    <!-- Customer Level JavaScript -->

    <script
        src="{{ url_for('static', filename='js/purchase-customer-level.js') }}"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="{{ url_for('static', filename='js/export-excel.js') }}"></script>
</body>

</html>
